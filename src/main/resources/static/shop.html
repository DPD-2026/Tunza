<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="js/auth.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tunza by Shaz – Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Liu+Jian+Mao+Cao&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tunza.css">
</head>
<body>
<div class="tz-page">

  <header class="tz-header">
    <a href="index.html" class="tz-header__logo" aria-label="Tunza – home"><img src="images/logo.png" alt=""></a>
    <nav class="tz-nav" aria-label="Site">
      <a href="about.html">About</a>
      <a href="lookbook.html">Lookbook</a>
      <a href="shop.html" aria-current="page">Shop</a>
    </nav>
  </header>

  <main class="product-main">
    <a href="lookbook.html" class="product-back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
      Back
    </a>

    <section class="product">
      <div class="product__left">
        <!-- Gallery: click a thumbnail to show it large -->
        <div class="product__gallery">
          <img class="product__main-img" id="product-main-img" src="images/product-back.png" alt="Hoodie and wide-leg trousers, back view">
          <div class="product__thumbs" role="group" aria-label="Product photos">
            <button type="button" class="product__thumb" aria-pressed="true" aria-label="Show back view"
                    data-src="images/product-back.png" data-alt="Hoodie and wide-leg trousers, back view">
              <img src="images/product-back.png" alt="">
            </button>
            <button type="button" class="product__thumb" aria-pressed="false" aria-label="Show side view"
                    data-src="images/product-side.png" data-alt="Hoodie and wide-leg trousers, side view">
              <img src="images/product-side.png" alt="">
            </button>
            <button type="button" class="product__thumb" aria-pressed="false" aria-label="Show trousers laid flat"
                    data-src="images/product-flat.png" data-alt="Wide-leg trousers laid flat">
              <img src="images/product-flat.png" alt="">
            </button>
          </div>
        </div>

        <div class="product__info">
          <button type="button" class="product__cart-btn">Add to cart</button>
          <div class="product__details">
            <h1 class="product__name">Trousers</h1>
            <p class="product__desc">Wide-leg trousers combining black fabric with striking geometric patterns. Relaxed, expressive and anything but ordinary.</p>
          </div>
        </div>
      </div>
      <img class="product__model-img" src="images/product-model.jpg" alt="Model wearing the hoodie and geometric wide-leg trousers">
    </section>

    <section class="product-editorial">
      <img src="images/product-editorial.jpg" alt="Model seated on a wooden chair in a garden, wearing the hoodie and trousers">
    </section>
  </main>

  <footer class="tz-footer">
    <div class="tz-footer__contact">
      <p class="tz-footer__name">SHARON SVARRER</p>
      <a class="tz-footer__email" href="mailto:hello@tunzabyshaz.com">hello@tunzabyshaz.com</a>
    </div>
    <div class="tz-footer__phone-wrap">
      <a class="tz-footer__phone" href="tel:+456528463">+45 6528463</a>
    </div>
    <div class="tz-footer__social">
      <a href="#" aria-label="Instagram">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"></circle></svg>
      </a>
      <a href="#" aria-label="LinkedIn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 10v9"></path><path d="M5 5.5v0.01"></path><path d="M10 19v-9"></path><path d="M10 13.5c0-2 1.5-3.5 3.5-3.5S17 11.5 17 13.5V19"></path></svg>
      </a>
    </div>
  </footer>
</div>

<script>
  // Product gallery: clicking a thumbnail shows that photo large.
  (function () {
    var main = document.getElementById('product-main-img');
    var thumbs = document.querySelectorAll('.product__thumb');
    thumbs.forEach(function (btn) {
      btn.addEventListener('click', function () {
        main.src = btn.dataset.src;
        main.alt = btn.dataset.alt;
        thumbs.forEach(function (b) { b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
      });
    });
  })();
</script>
</body>
</html>
