<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Tunza by Shaz – Log in</title>
  <script src="js/auth.js" data-login-page></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Liu+Jian+Mao+Cao&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tunza.css">
  <style>
    .login-main {
      min-height: 100vh; box-sizing: border-box;
      display: flex; align-items: center; justify-content: center;
      padding: 48px var(--tz-gutter);
    }
    .login-card { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
    .login-card__logo { height: 96px; width: auto; display: block; }
    .login-form { width: 100%; display: flex; flex-direction: column; gap: 12px; }
    .login-form label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
    .login-form input {
      font: inherit; font-size: 16px; padding: 12px 14px;
      border: 1px solid var(--tz-ink); background: var(--tz-cream); color: var(--tz-ink);
      border-radius: 0;
    }
    .login-form input:focus { outline: 2px solid var(--tz-wine); outline-offset: 2px; }
    .login-form button {
      font: inherit; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600;
      padding: 14px; border: 0; background: var(--tz-wine); color: var(--tz-cream); cursor: pointer;
    }
    .login-form button:hover { background: var(--tz-ink); }
    .login-error { min-height: 1.4em; margin: 0; font-size: 14px; color: var(--tz-wine); }
  </style>
</head>
<body>
<div class="tz-page">
  <main class="login-main">
    <div class="login-card">
      <img class="login-card__logo" src="images/logo.png" alt="Tunza by Shaz">
      <form class="login-form" id="login-form">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button type="submit">Enter</button>
        <p class="login-error" id="login-error" role="alert"></p>
      </form>
    </div>
  </main>
</div>

<script>
  (function () {
    // Only allow redirects to a page on this site (e.g. "shop.html?x#y").
    var next = new URLSearchParams(location.search).get('next') || '';
    if (!/^[\w-]+\.html([?#].*)?$/.test(next)) next = 'index.html';

    if (TunzaAuth.isLoggedIn()) { location.replace(next); return; }

    function sha256(text) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
        return Array.prototype.map.call(new Uint8Array(buf), function (b) {
          return b.toString(16).padStart(2, '0');
        }).join('');
      });
    }

    var form = document.getElementById('login-form');
    var input = document.getElementById('password');
    var error = document.getElementById('login-error');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      error.textContent = '';
      sha256(input.value).then(function (hash) {
        if (hash === TunzaAuth.hash) {
          TunzaAuth.logIn();
          location.replace(next);
        } else {
          error.textContent = 'Wrong password. Please try again.';
          input.select();
        }
      }).catch(function () {
        error.textContent = 'Your browser could not check the password. Open the site over https.';
      });
    });
  })();
</script>
</body>
</html>
